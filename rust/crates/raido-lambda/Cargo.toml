# SPDX-License-Identifier: EUPL-1.2
[package]
name = "raido-lambda"
description = "Fonction AWS Lambda Raido (binaire `bootstrap`, Function URL) : /v1/balade, /v1/trajet, /v1/sante ; tuiles de graphe lues sur S3 avec cache /tmp"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "raido_lambda"
path = "src/lib.rs"

[[bin]]
name = "bootstrap"
path = "src/bin/bootstrap.rs"

[dependencies]
raido-calcul = { path = "../raido-calcul" }
raido-format = { path = "../raido-format" }
# Briques AWS minimales de RuneRide Météo (SigV4, S3 GET, TLS en Rust pur : compilation arm64 sans compilateur C).
rw-aws = { git = "https://github.com/RuneRide/runeride-weather.git", rev = "f981a47" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
lambda_runtime = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
# Vérification du jeton court RS256 (JWKS du PHP) : RSA et SHA-256 en Rust pur
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
sha2 = "0.10"

[dev-dependencies]
rand = "0.8"
